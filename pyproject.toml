[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-engine"
version = "0.1.0"
description = "Validate CSV and JSON records, remove duplicates and store clean data in SQLite."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
document-engine = "document_engine.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
